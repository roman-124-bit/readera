<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>ReadEra — A quieter place to read</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242722;background:#f7f6f2;--bg:#f7f6f2;--panel:#fff;--ink:#242722;--muted:#84867f;--line:#e8e7e1;--accent:#597565;--shadow:0 12px 40px #2221}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);transition:background .3s,color .3s}body.dark{--bg:#161917;--panel:#212521;--ink:#f1f1ec;--muted:#a0a69e;--line:#363b36;--accent:#a9c3af;--shadow:0 12px 40px #0004}button,input{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,80px);border-bottom:1px solid var(--line);background:var(--panel);gap:12px}.logo{font-family:Georgia,serif;font-size:27px;font-weight:bold;cursor:pointer}.logo i{color:#bd9b69}.top-right{display:flex;align-items:center;gap:14px}.top-note,.muted{color:var(--muted);font-size:13px}.icon{background:transparent;color:var(--ink);padding:10px;border-radius:12px}.icon:hover,.soft:hover{background:var(--line)}.library{max-width:1250px;margin:auto;padding:72px clamp(20px,5vw,72px)}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--accent)}h1{font:normal clamp(42px,6vw,72px)/1.13 Georgia,serif;letter-spacing:-2px;margin:18px 0}h1 em{font-weight:normal;color:#839586}body.dark h1 em{color:#b4cbb8}.intro{color:var(--muted);line-height:1.7}.hero{display:flex;justify-content:space-between;align-items:end;gap:25px;flex-wrap:wrap;margin-bottom:90px}.primary{background:#526e5d;color:white;border-radius:12px;padding:15px 22px;font-weight:650;box-shadow:0 6px 15px #334b3825}.primary:hover{filter:brightness(1.1)}.section{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h2{font:normal 30px Georgia,serif;margin:0 0 8px}.search{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--panel);color:var(--ink);min-width:230px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}.chip{border-radius:30px;padding:10px 16px;background:transparent;color:var(--muted)}.chip.active{background:var(--ink);color:var(--bg)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:30px}.card{min-width:0;cursor:pointer}.cover{height:260px;border-radius:13px;display:flex;flex-direction:column;justify-content:space-between;padding:24px;background:linear-gradient(145deg,#e5ded0,#b8c5b7);color:#344339;box-shadow:var(--shadow);transition:transform .2s}.card:hover .cover{transform:translateY(-5px)}.card:nth-child(4n+2) .cover{background:linear-gradient(145deg,#e1d1c3,#b5a596)}.card:nth-child(4n+3) .cover{background:linear-gradient(145deg,#c7cfd8,#8b9ba8)}.card:nth-child(4n+4) .cover{background:linear-gradient(145deg,#dfd8c8,#c9ba8e)}.cover strong{font:normal 24px/1.25 Georgia,serif;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.cover small{font-size:10px;letter-spacing:2px}.card h3{font-size:16px;margin:17px 0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;gap:8px}.track{height:4px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:15px}.fill{height:100%;background:#839b88;transition:width .2s}.delete{background:transparent;color:var(--muted);padding:4px}.empty{border:1px dashed var(--line);padding:75px 15px;text-align:center;border-radius:20px;color:var(--muted)}.empty h3{color:var(--ink);font:normal 27px Georgia,serif}.reader{height:calc(100dvh - 72px);display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px clamp(12px,3vw,48px);background:var(--panel);border-bottom:1px solid var(--line)}.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.soft{background:transparent;color:var(--ink);padding:10px 12px;border-radius:10px}.soft.active{background:var(--line)}.zoom{font-size:12px;min-width:45px;text-align:center}.speed{width:85px;accent-color:var(--accent)}.surface{flex:1;overflow:auto;overscroll-behavior:contain;scrollbar-color:var(--muted) transparent}.pages{max-width:1100px;margin:auto;padding:28px 14px 80px}.page{margin:0 auto 25px;display:flex;justify-content:center;align-items:start;position:relative}.page canvas{max-width:none;background:white;box-shadow:0 8px 32px #0002}.page-num{position:absolute;bottom:-18px;color:var(--muted);font-size:10px}.foot{background:var(--panel);border-top:1px solid var(--line)}.foot .track{margin:0;border-radius:0;height:3px}.foot p{display:flex;justify-content:space-between;margin:10px 24px;font-size:11px;color:var(--muted);letter-spacing:1px}.reflow{max-width:740px;margin:35px auto;padding:35px;background:var(--panel);border-radius:16px;line-height:1.8;white-space:pre-wrap}.reflow section{margin-bottom:45px}.reflow small{color:var(--muted)}.focus .top,.focus .toolbar,.focus .foot{display:none}.focus .reader{height:100dvh}.exit{position:fixed;right:16px;top:15px;z-index:10;opacity:.35;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}.exit:hover{opacity:1}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#343b35;color:white;padding:14px 20px;border-radius:12px;z-index:30;max-width:90vw}input[type=range]{accent-color:var(--accent)}@media(max-width:650px){.top-note{display:none}.library{padding-top:45px}.hero{margin-bottom:55px}.toolbar{align-items:start}.tools{gap:2px}.soft{padding:9px}.speed{width:58px}.reflow{margin:12px;padding:20px}.cover{height:215px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.cover strong{font-size:20px}} 
</style></head><body><div id="app"></div><input type="file" id="file" accept=".pdf,application/pdf" multiple hidden>
<script type="module">
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const app=document.getElementById('app'),file=document.getElementById('file');
const state={books:[],book:null,pdf:null,page:1,zoom:1,mode:'pages',auto:false,speed:35,focus:false,filter:'All',query:'',theme:localStorage.getItem('readera-theme')||'light'};
let db,scrollEl,raf,lastFrame=0,saveTimer,renderToken=0,loadingPages=new Set(),pageRatios=new Map(),suspendScroll=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
const status=b=>b.progress>=99.9?'Finished':b.progress>0?'In Progress':'Unread';
const tx=(store,mode='readonly')=>db.transaction(store,mode).objectStore(store);
const request=req=>new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function initDB(){db=await new Promise((resolve,reject)=>{const req=indexedDB.open('readera-library',1);req.onupgradeneeded=()=>req.result.createObjectStore('books',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});await refresh()}
async function refresh(){state.books=(await request(tx('books').getAll())).sort((a,b)=>b.updated-a.updated)}
async function store(b){await request(tx('books','readwrite').put(b))}
function notify(s){const old=document.querySelector('.toast');old?.remove();const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),4500)}
function setTheme(){document.body.classList.toggle('dark',state.theme==='dark');localStorage.setItem('readera-theme',state.theme)}
function shell(){return '<header class="top"><div class="logo" id="logo">ReadEra<i>.</i></div><div class="top-note">'+(state.book?esc(state.book.title):'Your personal reading space')+'</div><div class="top-right"><button class="icon" id="theme" title="Toggle light and dark mode">'+(state.theme==='dark'?'☀':'☾')+'</button></div></header>'}
function render(){setTheme();app.innerHTML=shell()+(state.book?readerMarkup():libraryMarkup());document.getElementById('theme').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';render()};document.getElementById('logo').onclick=goLibrary;if(state.book)bindReader();else bindLibrary()}
function libraryMarkup(){const shown=state.books.filter(b=>b.title.toLowerCase().includes(state.query.toLowerCase())&&(state.filter==='All'||status(b)===state.filter));return '<main class="library"><div class="hero"><div><div class="eyebrow">YOUR PRIVATE LIBRARY</div><h1>A quieter place<br><em>to get lost in words.</em></h1><p class="intro">Everything you want to read, beautifully in one place.</p></div><button class="primary" id="add">＋ Add a PDF</button></div><div class="section"><div><h2>Your collection <span class="muted">'+state.books.length+'</span></h2><div class="muted">Pick up exactly where you left off.</div></div><input class="search" id="search" placeholder="Search your books..." value="'+esc(state.query)+'"></div><div class="filters">'+['All','Unread','In Progress','Finished'].map(f=>'<button class="chip '+(state.filter===f?'active':'')+'" data-filter="'+f+'">'+f+'</button>').join('')+'</div>'+(shown.length?'<div class="grid">'+shown.map(b=>'<article class="card" data-id="'+esc(b.id)+'"><div class="cover"><small>READERA COLLECTION</small><strong>'+esc(b.title)+'</strong><small>✦ &nbsp; READ WITH INTENTION</small></div><h3>'+esc(b.title)+'</h3><div class="meta"><span>'+status(b)+'</span><span><button class="delete" data-delete="'+esc(b.id)+'" aria-label="Remove book">✕</button> '+Math.round(b.progress||0)+'%</span></div><div class="track"><div class="fill" style="width:'+b.progress+'%"></div></div></article>').join('')+'</div>':'<div class="empty"><h3>'+(state.books.length?'No books found':'Your next chapter starts here.')+'</h3><p>'+(state.books.length?'Try another search or category.':'Add your first PDF to begin reading.')+'</p></div>')+'</main>'}
function bindLibrary(){document.getElementById('add').onclick=()=>file.click();document.getElementById('search').oninput=e=>{state.query=e.target.value;const pos=e.target.selectionStart;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(pos,pos)};document.querySelectorAll('[data-filter]').forEach(x=>x.onclick=()=>{state.filter=x.dataset.filter;render()});document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openBook(x.dataset.id));document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=async e=>{e.stopPropagation();if(!confirm('Remove this PDF from your library?'))return;await request(tx('books','readwrite').delete(x.dataset.delete));await refresh();render()})}
file.onchange=async()=>{for(const f of file.files){if(!f.name.toLowerCase().endsWith('.pdf')&&f.type!=='application/pdf'){notify('Please choose a PDF file');continue}const b={id:crypto.randomUUID(),title:f.name.replace(/\.pdf$/i,''),blob:f,page:1,progress:0,updated:Date.now()};try{await store(b);await refresh();await openBook(b.id)}catch(e){notify('Could not save the PDF: '+e.message)}}file.value=''};
async function openBook(id){stopAuto();const b=state.books.find(x=>x.id===id);if(!b)return;try{notify('Opening your book…');const bytes=new Uint8Array(await b.blob.arrayBuffer());const pdf=await pdfjs.getDocument({data:bytes}).promise;document.querySelector('.toast')?.remove();state.book=b;state.pdf=pdf;state.page=clamp(b.page||1,1,pdf.numPages);state.zoom=1;state.mode='pages';state.focus=false;pageRatios.clear();render();setTimeout(()=>jump(state.page),100)}catch(e){notify('Unable to read PDF: '+e.message)}}
function readerMarkup(){return '<div class="'+(state.focus?'focus':'')+'" id="reading"><div class="reader"><div class="toolbar"><button class="soft" id="back">← Library</button><div class="tools"><button class="soft" id="minus" title="Zoom out">−</button><span class="zoom">'+Math.round(state.zoom*100)+'%</span><button class="soft" id="plus" title="Zoom in">＋</button><button class="soft '+(state.mode==='pages'?'active':'')+'" id="pages">Pages</button><button class="soft '+(state.mode==='text'?'active':'')+'" id="text">Text</button><button class="soft '+(state.auto?'active':'')+'" id="auto">'+(state.auto?'Ⅱ Pause':'▶ Auto-scroll')+'</button><input class="speed" id="speed" type="range" min="10" max="150" step="5" title="Auto-scroll speed" value="'+state.speed+'"><button class="soft" id="focus" title="Focus mode">⛶ Focus</button></div></div><div class="surface" id="surface" tabindex="0">'+(state.mode==='pages'?'<div class="pages" id="pages-list"></div>':'<div class="reflow" id="reflow">Extracting text…</div>')+'</div><div class="foot"><div class="track"><div class="fill" id="progress" style="width:'+state.book.progress+'%"></div></div><p><span id="page-label">PAGE '+state.page+' / '+state.pdf.numPages+'</span><span id="percent">'+Math.round(state.book.progress)+'% READ</span></p></div></div>'+(state.focus?'<button class="exit" id="exit">Exit focus (Esc)</button>':'')+'</div>'}
function bindReader(){scrollEl=document.getElementById('surface');document.getElementById('back').onclick=goLibrary;document.getElementById('minus').onclick=()=>changeZoom(-.1);document.getElementById('plus').onclick=()=>changeZoom(.1);document.getElementById('pages').onclick=()=>setMode('pages');document.getElementById('text').onclick=()=>setMode('text');document.getElementById('auto').onclick=()=>{state.auto?stopAuto():startAuto();render();if(state.mode==='pages')jump(state.page)};document.getElementById('speed').oninput=e=>state.speed=+e.target.value;document.getElementById('focus').onclick=()=>{state.focus=true;render();jump(state.page)};if(state.focus)document.getElementById('exit').onclick=()=>{state.focus=false;render();jump(state.page)};['wheel','touchstart','pointerdown','keydown'].forEach(type=>scrollEl.addEventListener(type,()=>{if(state.auto){stopAuto();document.getElementById('auto').textContent='▶ Auto-scroll';document.getElementById('auto').classList.remove('active')}},{passive:true}));if(state.mode==='pages'){scrollEl.addEventListener('scroll',onScroll,{passive:true});renderWindow()}else renderText()}
function setMode(mode){stopAuto();state.mode=mode;render();if(mode==='pages')jump(state.page)}
function changeZoom(d){const p=state.page;state.zoom=clamp(Math.round((state.zoom+d)*10)/10,.6,2);render();if(state.mode==='pages')jump(p)}
function stopAuto(){state.auto=false;cancelAnimationFrame(raf);lastFrame=0}
function startAuto(){if(state.mode!=='pages')return;state.auto=true;lastFrame=0;const tick=t=>{if(!state.auto)return;if(lastFrame&&scrollEl){scrollEl.scrollTop+=state.speed*Math.min(t-lastFrame,60)/1000;if(scrollEl.scrollTop+scrollEl.clientHeight>=scrollEl.scrollHeight-2){stopAuto();return}}lastFrame=t;raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
function goLibrary(){stopAuto();state.book=null;state.pdf=null;state.focus=false;refresh().then(render)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.focus){state.focus=false;render();jump(state.page)}});
function pageHeight(n){const width=Math.min(860,Math.max(230,(scrollEl?.clientWidth||800)-35))*state.zoom;return width*(pageRatios.get(n)||1.414)+30}
function offset(n){let h=0;for(let i=1;i<n;i++)h+=pageHeight(i);return h}
function jump(n){if(!scrollEl||state.mode!=='pages')return;scrollEl.scrollTop=offset(n);renderWindow()}
function onScroll(){if(suspendScroll)return;const y=scrollEl.scrollTop;let acc=0,n=1;for(;n<=state.pdf.numPages;n++){const h=pageHeight(n);if(acc+h>y+scrollEl.clientHeight*.35)break;acc+=h}n=clamp(n,1,state.pdf.numPages);if(n!==state.page){state.page=n;updateProgress()}renderWindow()}
function updateProgress(){if(!state.book)return;const pct=state.pdf.numPages===1?100:clamp((state.page-1)/(state.pdf.numPages-1)*100,0,100);state.book.page=state.page;state.book.progress=pct;state.book.updated=Date.now();document.getElementById('progress')?.style.setProperty('width',pct+'%');const label=document.getElementById('page-label'),percent=document.getElementById('percent');if(label)label.textContent='PAGE '+state.page+' / '+state.pdf.numPages;if(percent)percent.textContent=Math.round(pct)+'% READ';clearTimeout(saveTimer);saveTimer=setTimeout(()=>store(state.book),450)}
function renderWindow(){const root=document.getElementById('pages-list');if(!root||!state.pdf)return;const n=state.pdf.numPages;let acc=0,first=1,last=1;const start=Math.max(0,scrollEl.scrollTop-scrollEl.clientHeight*1.3),end=scrollEl.scrollTop+scrollEl.clientHeight*2.3;for(let i=1;i<=n;i++){const h=pageHeight(i);if(acc+h>=start){first=i;break}acc+=h}last=first;let height=acc;while(last<=n&&height<end){height+=pageHeight(last);last++}last=Math.min(n,last);const before=offset(first),after=Math.max(0,offset(n+1)-offset(last+1));const signature=first+':'+last+':'+state.zoom;if(root.dataset.signature===signature)return;root.dataset.signature=signature;root.innerHTML='<div style="height:'+before+'px"></div>'+Array.from({length:last-first+1},(_,i)=>'<div class="page" data-page="'+(first+i)+'" style="min-height:'+pageHeight(first+i)+'px"><canvas></canvas><span class="page-num">'+(first+i)+'</span></div>').join('')+'<div style="height:'+after+'px"></div>';const token=++renderToken;root.querySelectorAll('.page').forEach(el=>drawPage(+el.dataset.page,el,token))}
async function drawPage(n,el,token){if(loadingPages.has(n))return;loadingPages.add(n);try{const page=await state.pdf.getPage(n);if(token!==renderToken||!el.isConnected)return;const viewport=page.getViewport({scale:1});const ratio=viewport.height/viewport.width;pageRatios.set(n,ratio);const width=Math.min(860,Math.max(230,scrollEl.clientWidth-35))*state.zoom;const scale=width/viewport.width;const dpr=Math.min(devicePixelRatio||1,2);const canvas=el.querySelector('canvas');const view=page.getViewport({scale:scale*dpr});canvas.width=Math.ceil(view.width);canvas.height=Math.ceil(view.height);canvas.style.width=width+'px';canvas.style.height=width*ratio+'px';await page.render({canvasContext:canvas.getContext('2d'),viewport:view}).promise}catch(e){if(e.name!=='RenderingCancelledException')console.warn(e)}finally{loadingPages.delete(n)}}
async function renderText(){const el=document.getElementById('reflow');if(!el)return;const pdf=state.pdf;el.style.fontSize=(18*state.zoom)+'px';el.textContent='';for(let n=1;n<=pdf.numPages;n++){if(state.pdf!==pdf||state.mode!=='text')break;const p=await pdf.getPage(n),content=await p.getTextContent();const section=document.createElement('section'),label=document.createElement('small');label.textContent='PAGE '+n;section.append(label);let lines=[],line='',y=null;for(const item of content.items){if(!('str' in item))continue;const next=item.transform?.[5];if(y!==null&&Math.abs(next-y)>4){lines.push(line);line=''}line+=item.str+' ';y=next;if(item.hasEOL){lines.push(line);line='';y=null}}if(line)lines.push(line);const para=document.createElement('p');para.textContent=lines.join('\n');section.append(para);el.append(section)}if(!el.textContent.trim())el.textContent='No selectable text found in this PDF.'}
try{await initDB();render()}catch(e){app.innerHTML='<main class="library"><h1>ReadEra</h1><p>Browser storage is unavailable. Please allow site storage and reload.</p></main>';console.error(e)}
</script></body></html>
